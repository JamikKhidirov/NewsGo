name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  goreleaser:
    name: Build & publish release
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: gonews
          POSTGRES_PASSWORD: gonews
          POSTGRES_DB: gonews
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gonews"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      GONEWS_TEST_DATABASE_URL: postgres://gonews:gonews@127.0.0.1:5432/gonews?sslmode=disable
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run tests
        run: go test -count=1 ./...

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gonews-release-${{ github.ref_name }}
          path: |
            dist/*.zip
            dist/*.tar.gz
            dist/checksums.txt
          if-no-files-found: error
