name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test & vet
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: gonews
          POSTGRES_PASSWORD: gonews
          POSTGRES_DB: gonews
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gonews"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      GONEWS_TEST_DATABASE_URL: postgres://gonews:gonews@127.0.0.1:5432/gonews?sslmode=disable
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Download modules
        run: go mod download

      - name: Check formatting
        run: |
          files=$(gofmt -l .)
          if [ -n "$files" ]; then
            echo "These files are not gofmt-ed:"
            echo "$files"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race -count=1 ./...

      - name: Build
        run: CGO_ENABLED=0 go build ./...

      - name: Smoke test
        env:
          GONEWS_HTTP_ADDR: 127.0.0.1:18080
          GONEWS_DATABASE_URL: postgres://gonews:gonews@127.0.0.1:5432/gonews?sslmode=disable
          GONEWS_REDIS_URL: ""
          GONEWS_KAFKA_BROKERS: ""
          GONEWS_JWT_SECRET: ci-smoke-secret
          GONEWS_INGEST_ON_START: "false"
          GONEWS_TRANSLATE_ENABLED: "false"
          GONEWS_PUSH_ENABLED: "false"
        run: |
          CGO_ENABLED=0 go build -trimpath -ldflags "-s -w" -o bin/gonews ./cmd/server
          ./bin/gonews &
          pid=$!
          trap "kill $pid" EXIT
          ok=false
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18080/healthz >/dev/null; then ok=true; break; fi
            sleep 1
          done
          if [ "$ok" != true ]; then echo "service did not become healthy"; exit 1; fi
          curl -fsS http://127.0.0.1:18080/healthz
          curl -fsS http://127.0.0.1:18080/readyz
          curl -fsS "http://127.0.0.1:18080/api/v1/news?limit=1"
          ./bin/gonews version

  build-windows:
    name: Build gonews.exe
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        shell: pwsh
        run: |
          $env:CGO_ENABLED = "0"
          go build -trimpath -ldflags "-s -w" -o bin/gonews.exe ./cmd/server

      - name: Verify binary
        shell: pwsh
        run: |
          $out = & bin/gonews.exe version
          if ($LASTEXITCODE -ne 0) { throw "gonews.exe failed to run" }
          Write-Host "Binary OK: $out"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: gonews-windows-amd64
          path: bin/gonews.exe
          if-no-files-found: error
